  # Publish the patched OpenBIOS blob committed under bios/ (the firmware
  # OpenBSD sparc64 guests need at run time; see bios/README.md) as a
  # release asset, so downstream consumers (anyvm's runtime, end users)
  # fetch it from the release alongside the VM images instead of from
  # raw.githubusercontent.
  # A single job, NOT part of the build matrix: every matrix job uploading
  # the same asset name in parallel would race (GitHub rejects duplicate
  # asset names), and the upload should not depend on any one image build
  # succeeding. Injected via UPLOAD_FILES_JOB in .github/data/datafile.ini;
  # builders without extra release files simply omit that key and the
  # template placeholder renders empty.
  release-files:
    if: "contains(github.ref, 'refs/tags/')"
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v6
    - name: Upload bios/ Release Assets
      uses: softprops/action-gh-release@v3
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        files: |
          bios/openbios-sparc64.elf
