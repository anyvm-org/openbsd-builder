
VM_RELEASE=7.9

VM_ISO_LINK="https://cloudflare.cdn.openbsd.org/pub/OpenBSD/7.9/sparc64/install79.iso"
VM_OS_NAME="openbsd"
VM_SSH_PORT=2224


VM_ROOT_PASSWORD=openbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"


VM_RSYNC_PKG="rsync--"
VM_SSHFS_PKG="sshfs-fuse"

VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_LOGIN_TAG="OpenBSD/sparc64"

VM_ARCH=sparc64
VM_USE_CONSOLE_BUILD=1
VM_NO_VNC_BUILD=1

#input  enablessh.local via nc
VM_USE_NC_ENABLE_SSH=1


# sun4u has no virtio; the NIC goes on the empty pciB bus (build.py places
# it there). e1000 -> em0 is used instead of ne2k_pci -> ne0: under QEMU's
# cmd646 PCI-IDE, concurrent network + disk DMA wedges the controller into a
# sustained "lost interrupt" write-timeout storm (same bug as NetBSD/sparc64),
# which on a slow TCG host stalls the runtime boot at "starting network" until
# the boot probe times out. e1000's DMA model keeps boot clean where ne2k did
# not (empirically verified on NetBSD/sparc64). Keep the .resp interface name
# (em0) in sync with this.
VM_NIC=e1000

# OpenBIOS cannot claim memory above ~2 GB and the locally verified
# config used 1024; the default 6144 would panic early boot.
VM_MEMORY=1024

# QEMU sun4u is a single-CPU machine; the default -smp 2 is rejected
# ("The max CPUs supported by machine 'sun4u' is 1").
VM_CPU=1

# The OpenBIOS bundled with QEMU crashes every OpenBSD >= 7.3 kernel on
# cold boot (call-method catch result written past the client's argument
# array when nreturns == 0) and names IDE channel nodes "ide" instead of
# OBP's "ata", which breaks the kernel's root-device autodetection.
# This repo vendors a patched blob; see bios/README.md.
VM_BIOS="bios/openbios-sparc64.elf"

# Build ON the patched qemu-system-sparc64 this repo publishes. Every
# upstream QEMU (the runners' stock 8.2 included) has the sun4u sabre
# single-slot IRQ-clobber bug: once cmd646 IDE and e1000 DMA complete
# concurrently, one device's interrupt-clear is dropped and both wedge --
# "wd0(pciide0:0:0): timeout" on the disk side, "em0: watchdog" on the NIC
# side. Builds have not tripped it so far (the install does little
# concurrent net+disk I/O), but building on the patched binary is what makes
# the published tarball a VERIFIED artifact rather than one no CI job ever
# ran: hooks/host_beforeBuild.sh compiles it from upstream sources
# (files/build-qemu-sparc64.sh applies files/qemu-sabre-irq-clobber.patch),
# setup() extracts VM_QEMU_TAR, and every VM in the pipeline runs on it.
# The release-files job publishes the same tarball, and anyvm downloads it
# from THIS builder's release at run time on Linux x86_64 hosts, where the
# wedge does bite (it has broken openbsd-vm sparc64 CI jobs).
VM_QEMU_TAR="build/qemu-10.2.3-sparc64-noble.tar.zst"
VM_QEMU_BIN="qemu10-sparc64/bin/qemu-system-sparc64"

VM_OPTS="conf/openbsd-7.9-sparc64.resp"

VM_SYNC_METHODS="rsync,scp,sshfs,nfs"
