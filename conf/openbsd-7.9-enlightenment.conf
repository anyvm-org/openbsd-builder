
# openbsd-7.9-enlightenment: a 7.9 amd64 install with the Enlightenment
# (E16, the classic) desktop hook applied. Note this is NOT E22+ /
# Moksha -- OpenBSD ports ships classic Enlightenment 16.
#
# IMPORTANT: end users must launch the resulting image with QEMU's -vga
# set to cirrus (anyvm.py: --vga cirrus, auto-selected for any release
# ending in -enlightenment). The default virtio-gpu has no DRM driver
# on OpenBSD 7.9 amd64, so Xorg cannot get a framebuffer.
# See hooks/enlightenment.sh.

VM_RELEASE=7.9-enlightenment

VM_ISO_LINK="https://cloudflare.cdn.openbsd.org/pub/OpenBSD/7.9/amd64/install79.iso"
VM_OS_NAME="openbsd"
VM_OS_TYPE="openbsd7.2"
VM_SSH_PORT=2224

VM_ROOT_PASSWORD=openbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"

VM_RSYNC_PKG="rsync--"
VM_SSHFS_PKG="sshfs-fuse"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_LOGIN_TAG="penBSD/amd64"

VM_NIC=virtio

VM_OPTS="conf/openbsd-7.9.resp"

# Run the Enlightenment (E16) desktop hook after the base install completes.
VM_EXTRA_SCRIPT="hooks/vm_enlightenment.sh"
