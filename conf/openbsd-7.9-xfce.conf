
# openbsd-7.9-xfce: a 7.9 amd64 install with the XFCE desktop hook applied.
#
# IMPORTANT: end users must launch the resulting image with QEMU's -vga
# set to cirrus (anyvm.py: --vga cirrus). The default virtio-gpu has no
# DRM driver on OpenBSD 7.9 amd64, so Xorg cannot get a framebuffer and
# the desktop will not come up. See hooks/xfce.sh for the full rationale.

VM_RELEASE=7.9-xfce

VM_ISO_LINK="https://cloudflare.cdn.openbsd.org/pub/OpenBSD/7.9/amd64/install79.iso"
VM_OS_NAME="openbsd"
VM_OS_TYPE="openbsd7.2"
VM_SSH_PORT=2224

VM_ROOT_PASSWORD=openbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"

# Match the non-desktop 7.9 conf for these.
VM_RSYNC_PKG="rsync--"
VM_SSHFS_PKG="sshfs-fuse"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_LOGIN_TAG="penBSD/amd64"

VM_NIC=virtio

VM_OPTS="conf/openbsd-7.9.resp"

VM_VBOX="./vbox.sh"
VM_VBOX_LINK="https://raw.githubusercontent.com/anyvm-org/vbox/v1.2.4/vbox.sh"

# Run the XFCE desktop hook after the base install completes.
VM_EXTRA_SCRIPT="hooks/xfce.sh"
