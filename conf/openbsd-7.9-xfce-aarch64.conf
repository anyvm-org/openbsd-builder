
# openbsd-7.9-xfce-aarch64: a 7.9 arm64 install with the XFCE desktop
# hook applied.
#
# IMPORTANT: end users must launch the resulting image with QEMU's
# virtio-gpu (anyvm.py: --vga virtio, the aarch64 default). Do NOT
# pass --vga cirrus for this build -- cirrus_drv is amd64-only in
# OpenBSD's Xenocara, and the arm64 hook (hooks/xfce-aarch64.sh)
# pins Xorg to the wsfb driver writing through viogpu0's wsdisplay.
# See hooks/xfce-aarch64.sh for the full rationale.

VM_RELEASE=7.9-xfce

VM_ISO_LINK="https://cloudflare.cdn.openbsd.org/pub/OpenBSD/7.9/arm64/install79.iso"
VM_OS_NAME="openbsd"
VM_OS_TYPE="openbsd7.2"
VM_SSH_PORT=2224

VM_ROOT_PASSWORD=openbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"

# Match the non-desktop 7.9 aarch64 conf for these.
# https://cdn.openbsd.org/pub/OpenBSD/7.9/packages/aarch64/
VM_RSYNC_PKG="rsync--"
VM_SSHFS_PKG="sshfs-fuse"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_LOGIN_TAG="penBSD/arm64"

VM_ARCH=aarch64
VM_USE_CONSOLE_BUILD=1

# input enablessh.local via nc (matches the 7.9 aarch64 base conf)
VM_USE_NC_ENABLE_SSH=1

VM_NIC=virtio

# Reuse the aarch64 install response file -- the desktop overlay
# happens later via VM_EXTRA_SCRIPT, after base install completes.
VM_OPTS="conf/openbsd-7.9-aarch64.resp"

# Run the arm64-specific XFCE desktop hook after base install completes.
VM_EXTRA_SCRIPT="hooks/vm_xfce-aarch64.sh"

VM_SYNC_METHODS="rsync,scp,sshfs,nfs,tar"
