
# openbsd-7.9-kde6: a 7.9 amd64 install with the KDE Plasma 6 hook applied.
#
# IMPORTANT: end users must launch the resulting image with QEMU's -vga
# set to cirrus (anyvm.py: --vga cirrus, auto-selected for any release
# ending in -kde6). The default virtio-gpu has no DRM driver on OpenBSD
# 7.9 amd64, so Xorg cannot get a framebuffer. See hooks/kde-plasma.sh.
#
# Note: first boot warm-up sits at load > 5 for ~ 3 minutes while kwin
# and plasmashell initialize on Cirrus software rendering with 4 MB VRAM.
# Subsequent boots show the same pattern. Once settled it idles ~ 1.

VM_RELEASE=7.9-kde6

VM_ISO_LINK="https://cloudflare.cdn.openbsd.org/pub/OpenBSD/7.9/amd64/install79.iso"
VM_OS_NAME="openbsd"
VM_OS_TYPE="openbsd7.2"
VM_SSH_PORT=2224

VM_ROOT_PASSWORD=openbsd

VM_SHUTDOWN_CMD="/sbin/shutdown -p now"
VM_INSTALL_CMD="pkg_add"

VM_RSYNC_PKG="rsync--"
VM_SSHFS_PKG="sshfs-fuse"
VM_PRE_INSTALL_PKGS="tree $VM_RSYNC_PKG $VM_SSHFS_PKG"

VM_LOGIN_TAG="penBSD/amd64"

VM_NIC=virtio

VM_OPTS="conf/openbsd-7.9.resp"

VM_VBOX="./vbox.sh"
VM_VBOX_LINK="https://raw.githubusercontent.com/anyvm-org/vbox/v1.2.4/vbox.sh"

# Run the KDE Plasma 6 desktop hook after the base install completes.
VM_EXTRA_SCRIPT="hooks/kde-plasma.sh"
